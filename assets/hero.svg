<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">SaveCompat</title>
  <desc id="desc">A passing old-save migration matrix from versions one and two to version three.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#72a7ff"/>
      <stop offset="1" stop-color="#8e7dff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="500" rx="30" fill="url(#bg)"/>
  <circle cx="1075" cy="60" r="190" fill="#72a7ff" opacity=".08"/>
  <circle cx="95" cy="470" r="235" fill="#8e7dff" opacity=".07"/>
  <g transform="translate(72 75)">
    <rect width="98" height="120" rx="18" fill="#151f32" stroke="#33425c" stroke-width="3"/>
    <path d="M62 0v30h36" fill="none" stroke="#526783" stroke-width="3"/>
    <circle cx="49" cy="74" r="26" fill="#163e36" stroke="#55d6a0" stroke-width="3"/>
    <path d="m35 74 10 10 20-23" fill="none" stroke="#55d6a0" stroke-linecap="round" stroke-linejoin="round" stroke-width="8"/>
  </g>
  <text x="202" y="150" fill="#f2f6fc" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="72" font-weight="800" letter-spacing="-3">Save<tspan fill="url(#accent)">Compat</tspan></text>
  <text x="204" y="196" fill="#9aa8ba" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="22">Prove old game saves still work before you ship.</text>
  <g transform="translate(72 255)" filter="url(#shadow)">
    <rect width="1056" height="170" rx="20" fill="#101826" stroke="#27344a" stroke-width="2"/>
    <text x="30" y="42" fill="#8090a6" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16">FIXTURE</text>
    <text x="668" y="42" fill="#8090a6" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16">PATH</text>
    <text x="920" y="42" fill="#8090a6" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16">STATUS</text>
    <line x1="25" y1="57" x2="1031" y2="57" stroke="#27344a"/>
    <text x="30" y="90" fill="#dce5f1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18">captain-v1.json</text>
    <text x="668" y="90" fill="#72a7ff" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18">v1 → v2 → v3</text>
    <text x="920" y="90" fill="#55d6a0" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" font-weight="700">PASS</text>
    <text x="30" y="128" fill="#dce5f1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18">miner-v2.json</text>
    <text x="668" y="128" fill="#72a7ff" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18">v2 → v3</text>
    <text x="920" y="128" fill="#55d6a0" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" font-weight="700">PASS</text>
    <text x="30" y="154" fill="#708096" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">schema ✓  preserved progress ✓  semantic diff ✓  deterministic ✓</text>
  </g>
</svg>
