name: Feature request
description: Propose a compatibility workflow or deterministic DSL improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Game-save problem
      description: What real compatibility failure is difficult to catch today?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Minimal before/after example
      description: Use synthetic JSON and show the intended result.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain missing paths, conflicts, determinism, and data-loss semantics.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: The proposal does not require network, time, randomness, or arbitrary code execution.
          required: true
